# Typesense service for local Jikan-REST development with Laravel Scout's
# native Typesense engine.
#
# This file is the single source of truth for the Typesense service. It is
#   - INCLUDED by the root docker-compose.yml via the top-level `include:`
#     (full stack: `docker compose up -d --build`), and
#   - usable standalone for a typesense-only instance:
#       docker compose -f docker-compose.typesense.yml up -d
#
# The API key is shared with the app: override it ONCE via the TYPESENSE_API_KEY
# variable and both services pick it up, e.g.
#   TYPESENSE_API_KEY=my-key docker compose up -d
#
# Host config in config/scout.php: host "typesense" (compose network) or
# "localhost" (standalone), port 8108, api key from TYPESENSE_API_KEY
# (defaults to "abcd").
#
# Usage (standalone):
#   docker compose -f docker-compose.typesense.yml up -d     # start
#   curl -sS http://localhost:8108/health                    # -> {"ok":true}
#   docker compose -f docker-compose.typesense.yml down      # stop (keeps volume)
#   docker compose -f docker-compose.typesense.yml down -v   # stop + wipe data volume
#
# IMPORTANT (see TYPESENSE_SPIKE.md):
# The native Scout TypesenseEngine requires a *pre-existing* collection with a
# valid schema (or `scout.typesense.model-settings.*.collection-schema`
# configured) — it cannot auto-create one from an empty schema. Create the
# collections before importing, e.g. with `artisan typesense:ensure-collections`
# if available, or the curl calls documented in TYPESENSE_SPIKE.md section
# "Pre-create collections".
services:
  typesense:
    image: typesense/typesense:27.0
    container_name: jikan-typesense
    restart: unless-stopped
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense-data:/data
    environment:
      # Must stay in sync with TYPESENSE_API_KEY used by the app.
      TYPESENSE_API_KEY: "${TYPESENSE_API_KEY:-abcd}"
      TYPESENSE_DATA_DIR: /data
    command:
      - --data-dir=/data
      - --api-key=${TYPESENSE_API_KEY:-abcd}
      - --port=8108
      - --enable-cors
    healthcheck:
      # typesense:27.0 has no curl; probe with bash's built-in /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8108 || exit 1; printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  typesense-data: