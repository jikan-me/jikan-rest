name: Container Image Release
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
permissions:
  packages: write
  contents: read
# Releases: push a git tag `vX.Y.Z` (e.g. `git tag v4.3.0 && git push origin v4.3.0`).
# That builds the Dockerfile for amd64 + arm64 and publishes, to both
# ghcr.io/jikan-me/jikan-rest and Docker Hub jikanme/jikan-rest:
#   X.Y.Z, X.Y and latest   (pre-release tags such as v4.3.1-rc.1 get only X.Y.Z-rc.1)
# Manual runs (workflow_dispatch) publish the given tag plus `latest-nightly`;
# they never touch `latest` or the X.Y / X.Y.Z release tags.
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (GITHUB_TOKEN is used for ghcr.io).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag for a manual/nightly build, e.g. nightly-20261019 (not "latest" or a version number)'
        required: true

env:
  REGISTRY_IMAGE: ghcr.io/jikan-me/jikan-rest

jobs:
  build-app-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    name: Build App container image
    steps:
      - name: Reject reserved manual tags
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "$IMAGE_TAG" == latest || "$IMAGE_TAG" =~ ^v?[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::'$IMAGE_TAG' is reserved for tag-triggered releases; pick e.g. nightly-$(date +%Y%m%d)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up qemu
        uses: docker/setup-qemu-action@v3

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Read metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.title=Jikan REST API
            org.opencontainers.image.description=REST API for Jikan
            org.opencontainers.image.url=https://jikan.moe
            org.opencontainers.image.source=https://github.com/jikan-me/jikan-rest
            org.opencontainers.image.documentation=https://github.com/jikan-me/jikan-rest/blob/master/container_usage.md
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            org.opencontainers.image.title=Jikan REST API
            org.opencontainers.image.description=REST API for Jikan
            org.opencontainers.image.url=https://jikan.moe
            org.opencontainers.image.source=https://github.com/jikan-me/jikan-rest
            org.opencontainers.image.documentation=https://github.com/jikan-me/jikan-rest/blob/master/container_usage.md
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_NO_SUMMARY: true
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # let's use github action cache storage
          cache-from: type=gha,scope=buildkit_${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=buildkit_${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Transform platform value
        id: platform_transform
        run: echo "platform=$(echo '${{ matrix.platform }}' | sed 's/\//_/g')" >> $GITHUB_OUTPUT

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform_transform.outputs.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-app-image:
    runs-on: ubuntu-latest
    name: Publish app container image
    needs:
      - build-app-image
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
            jikanme/jikan-rest
          labels: |
            org.opencontainers.image.title=Jikan REST API
            org.opencontainers.image.description=REST API for Jikan
            org.opencontainers.image.url=https://jikan.moe
            org.opencontainers.image.source=https://github.com/jikan-me/jikan-rest
            org.opencontainers.image.documentation=https://github.com/jikan-me/jikan-rest/blob/master/container_usage.md
            org.opencontainers.image.revision=${{ github.sha }}
          # `latest` is added explicitly below, never implicitly.
          flavor: |
            latest=false
          # semver tags strip the leading `v` (v4.3.0 -> 4.3.0, 4.3); {{major}}.{{minor}}
          # is skipped for pre-releases. Only a non-prerelease git tag gets `latest`.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest-nightly,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
