name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
      - laravel-12
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} · Mongo
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    services:
      mongodb:
        image: mongo:7.0   # 8.0+ refuses kernel >= 6.19 (SERVER-121912), which GitHub runners now ship
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_KEY: base64:Y2kY4Q0VwrVnlA+iihSWX9ZUlpHew19c9XMzCVMUn4A=
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      # Test DB is isolated from the production 'jikan' database.
      DB_HOST: 127.0.0.1
      DB_PORT: 27017
      DB_DATABASE: jikan_tests
      DB_USERNAME: ""
      DB_PASSWORD: ""
      # In-memory cache (per-process is fine for tests).
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      CACHE_DEFAULT_EXPIRE: 86400
      CACHE_USER_EXPIRE: 300
      CACHE_USERLIST_EXPIRE: 3600
      CACHE_SEARCH_EXPIRE: 432000
      CACHE_MAGAZINE_EXPIRE: 432000
      MAX_RESULTS_PER_PAGE: 25
      # SCOUT_DRIVER intentionally unset: tests exercise the Mongo "$text"
      # fallback (the local default), not the Typesense engine.
      GITHUB_REPORTING: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl,intl,mbstring,mongodb-stable,opcache,sockets,pcntl,redis,brotli
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Security advisories (composer audit)
        # Fails on a known advisory in composer.lock; abandoned packages are reported, not fatal.
        run: composer audit --locked --abandoned=report

      - name: Install dependencies
        # Lock is resolved against config.platform = 8.4.27; --ignore-platform-req=php
        # lets a runner with an older 8.4 patch release install the identical lock.
        run: |
          composer install --no-interaction --no-progress --no-scripts --prefer-dist --ignore-platform-req=php

      - name: Lint PHP sources
        run: |
          find app bootstrap config routes tests database -name '*.php' -print0 \
            | xargs -0 -n1 php -d error_reporting=24575 -l

      - name: Static analysis (PHPStan)
        run: php -d error_reporting=24575 vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Code style (Pint)
        # Whole repo, rules from pint.json (Laravel preset, `!$var`).
        run: vendor/bin/pint --test

      - name: Run PHPUnit suite
        run: vendor/bin/phpunit --no-coverage

      - name: Show logs on failure
        if: failure()
        run: |
          ls -1 storage/logs/*.log 2>/dev/null || true
          tail -50 storage/logs/laravel.log 2>/dev/null || true
  artifact-freshness:
    name: Agent artifacts — spec, manifest, catalog
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:Y2kY4Q0VwrVnlA+iihSWX9ZUlpHew19c9XMzCVMUn4A=
      DB_DATABASE: jikan_tests
      CACHE_DRIVER: array
      GITHUB_REPORTING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          # composer.lock requires ext-mongodb ^2.5 (and composer.json ext-pcntl);
          # without them `composer install` fails before any check runs.
          extensions: mongodb-stable, pcntl, brotli
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-scripts --prefer-dist --ignore-platform-req=php
      - name: Regenerate OpenAPI spec
        run: php artisan l5-swagger:generate
      - name: Regenerate AI artifacts
        run: composer endpoints:write
      - name: Gate — committed artifacts must not drift
        run: |
          composer endpoints:check
          git diff --exit-code -- storage/api-docs/api-docs.json docs/ai \
            || { echo "::error::Generated artifacts are stale. Run 'php artisan l5-swagger:generate' and 'composer endpoints:write', then commit."; exit 1; }
      - name: Serve smoke — /llms.txt and /v4/ai/manifest.json
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 >/tmp/serve.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:8000/llms.txt | head -n 1
          test "$(curl -fsS http://127.0.0.1:8000/v4/ai/manifest.json | grep -c '"tools"')" -ge 1

  coverage:
    name: Coverage (xdebug · clover)
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:Y2kY4Q0VwrVnlA+iihSWX9ZUlpHew19c9XMzCVMUn4A=
      DB_HOST: 127.0.0.1
      DB_PORT: 27017
      DB_DATABASE: jikan_tests
      DB_USERNAME: ""
      DB_PASSWORD: ""
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      GITHUB_REPORTING: "false"
      # SCOUT_DRIVER intentionally unset (engine-less Mongo $text), same as tests.
    services:
      mongodb:
        image: mongo:7.0   # see the note on the first job
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          # Same extensions as the other jobs: composer.lock needs ext-mongodb, composer.json ext-pcntl.
          extensions: mongodb-stable, pcntl, brotli
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-scripts --prefer-dist --ignore-platform-req=php
      - name: Run suite with coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
