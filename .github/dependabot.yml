# Dependency update policy.
#
# composer: weekly, all packages, with minor/patch bumps grouped to keep PR noise down. The
# parser (jikan-me/*) is excluded from the group so every bump gets its own PR and its own review.
# github-actions: monthly.
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "jikan-me/*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
